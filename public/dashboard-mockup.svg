<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Arial, Helvetica, sans-serif">
  <!-- page bg -->
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#f1f5f9"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="264" height="900" fill="#020617"/>
  <!-- brand -->
  <rect x="20" y="20" width="40" height="40" rx="10" fill="#1d4ed8" opacity="0.25"/>
  <rect x="20" y="20" width="40" height="40" rx="10" fill="none" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="34" y="46" font-size="18" font-weight="700" fill="#93c5fd">V</text>
  <text x="70" y="38" font-size="16" font-weight="700" fill="#ffffff">VortexGin</text>
  <text x="70" y="54" font-size="11" fill="#94a3b8">Workspace</text>

  <!-- nav items -->
  <g font-size="13" font-weight="600">
    <rect x="12" y="84" width="240" height="44" rx="10" fill="#ffffff" opacity="0.10"/>
    <rect x="22" y="93" width="26" height="26" rx="7" fill="#3b82f6" opacity="0.3"/>
    <text x="28" y="111" fill="#bfdbfe">◧</text>
    <text x="56" y="111" fill="#ffffff">Dashboard</text>

    <rect x="22" y="139" width="26" height="26" rx="7" fill="#ffffff" opacity="0.07"/>
    <text x="29" y="157" fill="#cbd5e1">○</text>
    <text x="56" y="157" fill="#cbd5e1">Users</text>

    <rect x="22" y="179" width="26" height="26" rx="7" fill="#ffffff" opacity="0.07"/>
    <text x="29" y="197" fill="#cbd5e1">◇</text>
    <text x="56" y="197" fill="#cbd5e1">Roles</text>

    <rect x="22" y="219" width="26" height="26" rx="7" fill="#ffffff" opacity="0.07"/>
    <text x="29" y="237" fill="#cbd5e1">▤</text>
    <text x="56" y="237" fill="#cbd5e1">Menus</text>

    <rect x="22" y="259" width="26" height="26" rx="7" fill="#ffffff" opacity="0.07"/>
    <text x="29" y="277" fill="#cbd5e1">◉</text>
    <text x="56" y="277" fill="#cbd5e1">Actions</text>

    <rect x="22" y="299" width="26" height="26" rx="7" fill="#ffffff" opacity="0.07"/>
    <text x="29" y="317" fill="#cbd5e1">⚙</text>
    <text x="56" y="317" fill="#cbd5e1">Settings</text>
  </g>

  <!-- sidebar footer note -->
  <rect x="16" y="800" width="232" height="76" rx="14" fill="#ffffff" opacity="0.06"/>
  <text x="30" y="826" font-size="11" fill="#cbd5e1">Signed in securely with</text>
  <text x="30" y="842" font-size="11" fill="#cbd5e1">VortexGin SSO.</text>

  <!-- topbar -->
  <rect x="264" y="0" width="1176" height="64" fill="#ffffff" opacity="0.92"/>
  <line x1="264" y1="64" x2="1440" y2="64" stroke="#e2e8f0" stroke-width="1"/>
  <text x="292" y="29" font-size="14" font-weight="700" fill="#0f172a">Dashboard</text>
  <text x="292" y="47" font-size="11" fill="#64748b">Welcome back to your workspace</text>

  <!-- SSO badge -->
  <rect x="1050" y="18" width="110" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1072" y="37" font-size="11" font-weight="600" fill="#64748b">VortexGin SSO</text>

  <!-- user button -->
  <rect x="1172" y="12" width="248" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="1196" cy="32" r="14" fill="#2563eb"/>
  <text x="1190" y="37" font-size="11" font-weight="700" fill="#ffffff">JD</text>
  <text x="1216" y="29" font-size="12" font-weight="600" fill="#0f172a">John Doe</text>
  <text x="1216" y="43" font-size="10" fill="#64748b">john@example.com</text>
  <text x="1404" y="36" font-size="11" fill="#94a3b8">▾</text>

  <!-- dropdown -->
  <rect x="1180" y="60" width="240" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1196" y="88" font-size="13" font-weight="700" fill="#0f172a">John Doe</text>
  <text x="1196" y="104" font-size="11" fill="#64748b">john@example.com</text>
  <line x1="1180" y1="116" x2="1420" y2="116" stroke="#f1f5f9" stroke-width="1"/>
  <text x="1196" y="142" font-size="13" fill="#334155">Update profile</text>
  <text x="1196" y="172" font-size="13" fill="#334155">Change password</text>
  <line x1="1180" y1="186" x2="1420" y2="186" stroke="#f1f5f9" stroke-width="1"/>
  <text x="1196" y="212" font-size="13" font-weight="700" fill="#dc2626">Logout</text>

  <!-- content card -->
  <rect x="560" y="220" width="584" height="220" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="268" font-size="12" font-weight="700" letter-spacing="3" fill="#2563eb">DASHBOARD</text>
  <text x="600" y="306" font-size="28" font-weight="700" fill="#0f172a">Welcome to the Dashboard.</text>
  <text x="600" y="340" font-size="13" fill="#64748b">Sidebar menu on left. User dropdown top right.</text>
  <text x="600" y="362" font-size="13" fill="#64748b">Dropdown holds: update profile, change password, logout.</text>
</svg>
